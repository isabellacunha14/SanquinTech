<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - Sanquim Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./funcionario-cadastroUsuario.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="background-container">
        <header class="navbar">
            <div class="logo">
                <img src="../Imagens/logosanquim.png" alt="Sanquim Tech Logo">
            </div>
            <nav class="nav-links">
                <ul>
                    <li><a href="funcionario-dashboard.html" class="nav-item" data-page="funcionario-dashboard">Início</a></li>
                    <li><a href="funcionario-cadastroUsuario.css" class="nav-item active" data-page="cadastro-usuario">Cadastros</a></li>
                    <li><a href="funcionario-cadastroAcademico.html" class="nav-item" data-page="cadastro-academico">Acadêmico</a></li>
                    <li><a href="funcionario-biblioteca.html" class="nav-item" data-page="biblioteca-virtual">Biblioteca Virtual</a></li>
                    <li><a href="../Login/login.html" class="nav-item" data-page="sair">Sair</a></li>
                </ul>
            </nav>
        </header>

        <main class="content-area">
            <div class="main-card"> 
                <h2 class="page-title"><i class="fas fa-user-plus"></i> Cadastro de Novo Usuário</h2>

                <div class="form-container">
                    <form id="cadastroUsuarioForm">
                        <div class="form-group">
                            <label for="tipoUsuario">Tipo de Usuário:</label>
                            <select id="tipoUsuario" name="tipoUsuario" required>
                                <option value="">Selecione o tipo de usuário</option>
                                <option value="aluno">Aluno</option>
                                <option value="professor">Professor</option>
                                <option value="funcionario">Funcionário</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="nomeCompleto">Nome Completo:</label>
                            <input type="text" id="nomeCompleto" name="nomeCompleto" placeholder="Digite o nome completo" required>
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail:</label>
                            <input type="email" id="email" name="email" placeholder="Digite o e-mail" required>
                        </div>

                        <div class="form-group">
                            <label for="cpf">CPF:</label>
                            <input type="text" id="cpf" name="cpf" placeholder="Ex: 123.456.789-00" maxlength="14" required>
                        </div>

                        <div class="form-group">
                            <label for="dataNascimento">Data de Nascimento:</label>
                            <input type="date" id="dataNascimento" name="dataNascimento" required>
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone:</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX" maxlength="15">
                        </div>

                        <div id="camposAdicionais" class="campos-adicionais">
                            </div>

                        <button type="submit" class="btn-submit"><i class="fas fa-user-check"></i> Cadastrar Usuário</button>
                    </form>
                </div>
            </div>
            <div class="main-card registros-card">
                <h2 class="page-title"><i class="fas fa-users"></i> Usuários Cadastrados</h2>
                <div id="registrosArmazenados" class="registros-list">
                    <p class="no-records-message">Nenhum usuário cadastrado ainda.</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="contact-info">
                <p>Praça Duque de Caxias, 169 - Centro - Mogi Mirim</p>
            </div>
            <div class="social-media">
                <p>Nos siga nas redes sociais.</p>
                <a href="https://web.facebook.com/sanquim/?_rdc=1&_rdr#" target="_blank"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/colegiosanquim/" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://www.youtube.com/channel/UCc1HL8KqpsJat7hDp90mnag" target="_blank"><i class="fab fa-youtube"></i></a>
            </div>
        </footer>
    </div>

    <div id="mainModal" class="modal"></div>

    <script src="../Funcionario/funcionario-dashboard.js"></script>
    <script src="./funcionario-cadastroUsuario.js"></script> </body>
</html>
