<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos - Portal Coordenador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./coordenador-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="background-container">
        <header class="navbar">
            <div class="logo">
                <img src="../Imagens/logosanquim.png" alt="Sanquim Tech Logo">
            </div>
            <nav class="nav-links">
                <ul>
                    <li><a href="coordenador-dashboard.html" class="nav-item" data-page="coordenador-dashboard">Início</a></li>
                    <li><a href="coordenador-gestao.html" class="nav-item" data-page="coordenador-gestao">Gestão</a></li>
                    <li><a href="coordenador-relatorio.html" class="nav-item" data-page="coordenador-relatorios">Relatórios</a></li>
                    <li><a href="coordenador-avisos.html" class="nav-item" data-page="coordenador-avisos">Avisos</a></li>
                    <li><a href="../Login/login.html" class="nav-item" data-page="sair">Sair</a></li>
                </ul>
            </nav>
        </header>

        <main class="content-area">
            <div class="main-dashboard-card"> 
                <h2 id="pageTitle"><i class="fas fa-bullhorn"></i> Avisos</h2>
                
                <section class="content-section">
                    <div class="avisos-form-container">
                        <h3>Publicar Novo Aviso</h3>
                        <div class="form-group">
                            <label for="avisoTitle">Título do Aviso:</label>
                            <input type="text" id="avisoTitle" placeholder="Ex: Prova Substitutiva, Mudança de Horário">
                        </div>
                        <div class="form-group">
                            <label for="avisoDate">Data de Publicação:</label>
                            <input type="date" id="avisoDate"> </div>
                        <div class="form-group">
                            <label for="avisoContent">Conteúdo do Aviso:</label>
                            <textarea id="avisoContent" rows="10" placeholder="Escreva o conteúdo completo do seu comunicado aqui."></textarea>
                        </div>
                        <button id="publicarAvisoBtn"><i class="fas fa-paper-plane"></i> Publicar Aviso</button>
                    </div>

                    <hr class="separator">

                    <div class="avisos-history-container">
                        <h3>Histórico de Avisos Publicados</h3>
                        <div id="avisosListContainer" class="avisos-list-container">
                            <p class="no-avisos-message">Nenhum aviso publicado ainda.</p>
                            </div>
                    </div>
                </section>
            </div>
        </main>

        <footer class="footer">
            <div class="contact-info">
                <p>Praça Duque de Caxias, 169 - Centro - Mogi Mirim</p>
            </div>
            <div class="social-media">
                <p>Nos siga nas redes sociais.</p>
                <a href="https://web.facebook.com/sanquim/?_rdc=1&_rdr#" target="_blank"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/colegiosanquim/" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://www.youtube.com/channel/UCc1HL8KqpsJat7hDp90mnag" target="_blank"><i class="fab fa-youtube"></i></a>
            </div>
        </footer>
    </div>

    <script src="./coordenador-avisos.html"></script>
</body>
</html>
