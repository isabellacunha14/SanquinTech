<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sanquim Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="testes.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <img src="logosanquim.png" alt="Sanquim Tech Logo" class="login-logo">
            <h2>Bem-vindo(a) ao SanquimTech</h2>
            <p>Portal do Aluno</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seuemail@sanquim.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <button type="submit" id="loginButton">Entrar</button>
                <p id="errorMessage" class="error-message"></p>
            </form>

            <div class="login-footer">
                <a href="#">Esqueceu a senha?</a>
                <span>|</span>
                <a href="#">Criar conta</a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
