<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sanquim Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="esqueceu-senha.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="background-container">
        <div class="login-container">
            <div class="logo">
                <img src="../Imagens/logosanquim.png" alt="Sanquim Tech Logo">
            </div>
            <h2>Confirme seu E-mail</h2>
            <form id="senhaForm">
                <div class="input-group">
                    <input type="email" id="email" name="email" placeholder="E-mail" required>
                </div>
                <button type="submit" class="btn-entrar">Confirmar</button>
                <p id="errorMessage" class="error-message"></p>
            </form>
            <a href="login.html" class="forgot-password">Voltar</a>
        </div>
    </div>
    <script src="esqueceu-senha.js"></script>
</body>
</html>
